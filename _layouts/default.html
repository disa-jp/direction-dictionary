<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.title and page.title != site.title %}{{ page.title }}｜{% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta name="author" content="{{ site.author }}">
<link rel="icon" href="{{ '/assets/favicon.png' | relative_url }}" type="image/png">
<link rel="apple-touch-icon" href="{{ '/assets/favicon.png' | relative_url }}">
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--line:#e5e5e5;--acc:#0b5fff;--card:#fafafa}
@media(prefers-color-scheme:dark){:root{--bg:#151517;--fg:#e8e8e8;--mut:#a0a0a0;--line:#303034;--acc:#7aa2ff;--card:#1e1e22}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.85;font-size:16px}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
header.site{border-bottom:1px solid var(--line);padding:14px 0;margin-bottom:40px}
.brand{display:inline-flex;align-items:center;gap:11px;color:var(--fg);text-decoration:none}
.brand .logo{height:21px;width:auto;display:block;flex:none}
.brand .rule{width:1px;height:18px;background:var(--line);flex:none}
.brand .name{font-weight:700;font-size:15px;letter-spacing:.01em}
@media(max-width:420px){.brand{gap:9px}.brand .logo{height:18px}.brand .name{font-size:14px}}
a{color:var(--acc)}
h1{font-size:26px;line-height:1.5;margin:0 0 6px}
h2{font-size:20px;margin:44px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
h4{font-size:17px;margin:36px 0 10px}
.meta{color:var(--mut);font-size:13px;margin-bottom:32px}
.summary{background:var(--card);border-left:3px solid var(--acc);border-radius:0 6px 6px 0;padding:4px 20px;margin:24px 0}
hr{border:0;border-top:1px solid var(--line);margin:32px 0}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left}
code{background:var(--card);padding:2px 5px;border-radius:4px;font-size:88%}
.toc h2{font-size:17px;margin:36px 0 8px}
.toc ul{padding-left:0;list-style:none}
.toc li{padding:5px 0;border-bottom:1px solid var(--line);font-size:15px}
.toc .n{color:var(--mut);font-variant-numeric:tabular-nums;margin-right:10px;font-size:13px}
nav.pager{display:flex;justify-content:space-between;gap:16px;margin:48px 0 0;font-size:14px}
footer.site{border-top:1px solid var(--line);margin-top:56px;padding:24px 0 60px;color:var(--mut);font-size:13px}
img{max-width:100%}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<header class="site"><div class="wrap">
<a class="brand" href="{{ '/' | relative_url }}">
{% include logo.svg %}
<span class="rule"></span>
<span class="name">ディレクション辞書</span>
</a>
</div></header>
<main class="wrap">{{ content }}</main>
<footer class="site"><div class="wrap">
<p>制作: <a href="{{ site.org_url }}">{{ site.author }}</a>／ソース: <a href="https://github.com/disa-jp/direction-dictionary">GitHub</a></p>
<p>本辞書は <a href="https://creativecommons.org/licenses/by/4.0/deed.ja">CC BY 4.0</a> で公開しています。出典を明記すれば、商用利用を含めて自由に利用できます。</p>
</div></footer>
</body></html>
