<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    background:#fff;
    font-family:"Hiragino Sans","Noto Sans JP",-apple-system,sans-serif;
    color:#1a1a1a;
    display:flex;
  }
  .bar{width:14px;height:100%;background:#0b5fff;flex:none}
  .inner{flex:1;padding:74px 80px 64px;display:flex;flex-direction:column;justify-content:space-between}
  .eyebrow{font-size:23px;font-weight:600;color:#666;letter-spacing:.06em}
  .title{font-size:92px;font-weight:800;letter-spacing:.02em;line-height:1.15;margin:26px 0 0}
  .rule{width:96px;height:5px;background:#0b5fff;margin:34px 0 30px;border-radius:3px}
  .lead{font-size:29px;line-height:1.75;color:#3a3a3a;font-weight:500}
  .foot{display:flex;align-items:baseline;gap:22px;border-top:1px solid #e5e5e5;padding-top:26px}
  .count{font-size:27px;font-weight:700;color:#0b5fff}
  .host{font-size:25px;color:#666;font-weight:600;letter-spacing:.02em}
  .org{margin-left:auto;font-size:21px;color:#8a8a8a}
</style></head>
<body>
  <div class="bar"></div>
  <div class="inner">
    <div>
      <p class="eyebrow">DIRECTION DICTIONARY</p>
      <h1 class="title">ディレクション辞書</h1>
      <div class="rule"></div>
      <p class="lead">Webディレクションの実務で使う用語・業務・考え方を、<br>1項目1ページでまとめた辞書。</p>
    </div>
    <div class="foot">
      <span class="count">全154項目</span>
      <span class="host">dic.drsp.cc</span>
      <span class="org">一般社団法人ディレクションサポート協会（DiSA）</span>
    </div>
  </div>
</body></html>
