title: ディレクション辞書
description: Webディレクションの実務で使う用語・業務・考え方を、1項目1ページでまとめた辞書。一般社団法人ディレクションサポート協会（DiSA）制作。全154項目。
url: https://dic.drsp.cc
baseurl: ""
lang: ja
author: 一般社団法人ディレクションサポート協会（DiSA）
org_url: https://drsp.cc/

# OGP/Twitterカードの画像（1200x630）。元データは scripts/ogp-source.html
ogp_image: https://dic.drsp.cc/assets/ogp.webp

# GA4の測定ID（G-XXXXXXXXXX）。空のあいだはタグを出力しない
google_analytics: "G-ZF7KNVZYPV"

plugins:
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

defaults:
  - scope: { path: "", type: "pages" }
    values: { layout: "entry" }

exclude:
  - scripts
  - README.md
  - CNAME
  - LICENSE
  - Gemfile
  - Gemfile.lock
