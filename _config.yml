title: ディレクション辞書
description: Webディレクションの実務で使う用語・業務・考え方を、1項目1ページでまとめた辞書。一般社団法人ディレクションサポート協会（DiSA）制作。全138項目。
url: https://disa-jp.github.io
baseurl: /direction-dictionary
lang: ja
author: 一般社団法人ディレクションサポート協会（DiSA）
org_url: https://drsp.cc/

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

defaults:
  - scope: { path: "", type: "pages" }
    values: { layout: "entry" }

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
